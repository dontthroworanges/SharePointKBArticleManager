name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
        continue-on-error: true # advisory until the existing warnings are cleared
      - name: Test
        run: cargo test --locked
      - name: Build (release)
        run: cargo build --release --locked

  web-bundle:
    # web/vendor/tiptap.js is checked in; make sure it matches its sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Bundle is up to date
        run: git diff --exit-code web/vendor/tiptap.js
