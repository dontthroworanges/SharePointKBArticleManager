name: Release

# Push a tag such as v0.5.0 or Beta-v0.5.0 to build the app and publish it as a GitHub release.
# Run it by hand (Actions > Release > Run workflow) to build a tag that already exists.
on:
  push:
    tags: ["v[0-9]*", "*-v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}" -replace "^.*?v(?=d)", ""
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'kb-editor' | ForEach-Object version
          if ($tag -ne $version) { throw "Tag v$tag does not match Cargo.toml version $version" }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $dest = "SharePointKBArticleManager-$env:VERSION-win-x64"
          New-Item -ItemType Directory $dest | Out-Null
          # The exe plus the Windows App SDK runtime copied beside it; not cargo's build folders.
          $skip = 'build', 'deps', 'examples', 'incremental', '.fingerprint'
          Get-ChildItem target/release | Where-Object {
            $_.Name -notin $skip -and $_.Extension -notin '.d', '.pdb', '.exp', '.lib', '.rlib'
          } | Copy-Item -Destination $dest -Recurse
          Copy-Item LICENSE, README.md $dest
          Compress-Archive -Path $dest -DestinationPath "$dest.zip"
          "ASSET=$dest.zip" | Out-File -Append $env:GITHUB_ENV

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $pre = @(); if ($tag -match "beta|rc|alpha") { $pre = @("--prerelease") }
          gh release create $tag "$env:ASSET" --verify-tag --title $tag --generate-notes @pre
