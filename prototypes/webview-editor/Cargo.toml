[package]
name = "kb-webview-prototype"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Prototype: the KB article editor's text surface as Tiptap in WebView2"

[dependencies]
comrak = { version = "1.2.0", default-features = false }
raw-window-handle = "0.6"
rfd = { version = "0.18.0", default-features = false }
serde_json = "1"
windows-core = "0.100"
windows-reactor = "0.100.0"

[build-dependencies]
windows-reactor-setup = "0.100.0"

# Its own workspace, apart from the app's, so building it never touches the app's lockfile.
[workspace]
members = [".", "bindgen"]

# The app's vendored Reactor (it adds `request_native_object`), used as is.
[patch.crates-io]
windows-reactor = { path = "../../vendor/windows-reactor" }
